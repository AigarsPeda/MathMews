# Publishes only the public release pages → https://aigarspeda.github.io/MathMews/
# One-time setup: Settings → Pages → Source: GitHub Actions (see docs/README.md)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # docs/ also contains private project notes and development artifacts.
      # Only this explicit list belongs in the public Pages artifact.
      - name: Stage public pages
        run: |
          mkdir -p _site
          cp docs/index.html docs/privacy.html docs/support.html docs/delete-account.html docs/site.css docs/site.js _site/
          mkdir -p _site/lv _site/assets
          cp docs/lv/index.html docs/lv/privacy.html docs/lv/support.html docs/lv/delete-account.html _site/lv/
          cp docs/assets/cat.png _site/assets/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
