name: Game regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint . --max-warnings 0
      - run: npm run test:startup
      - run: npm run test:game
      - run: npm run assets:verify -- --runtime-only
